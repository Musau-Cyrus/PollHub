<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Poll - PollHub</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <div class="logo-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="20" x2="18" y2="10"></line>
                            <line x1="12" y1="20" x2="12" y2="4"></line>
                            <line x1="6" y1="20" x2="6" y2="14"></line>
                        </svg>
                    </div>
                    <h1>PollHub</h1>
                </div>
                <a href="index.html" class="btn btn-secondary">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    Back to Home
                </a>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            <div class="form-container">
                <div class="form-card">
                    <h2 class="form-title">Create New Poll</h2>
                    
                    <form id="create-poll-form">
                        <div class="form-group">
                            <label for="poll-question" class="form-label">Poll Question</label>
                            <input 
                                type="text" 
                                id="poll-question" 
                                class="form-input" 
                                placeholder="What would you like to ask?"
                                required
                                maxlength="500"
                            >
                            <small class="form-hint">Maximum 500 characters</small>
                        </div>

                        <div class="form-group">
                            <label for="created-by" class="form-label">Your Name (Optional)</label>
                            <input 
                                type="text" 
                                id="created-by" 
                                class="form-input" 
                                placeholder="Enter your name"
                                maxlength="100"
                            >
                        </div>

                        <div class="form-group">
                            <label class="form-label">Poll Options</label>
                            <div id="options-container">
                                <div class="option-input-group">
                                    <input 
                                        type="text" 
                                        class="form-input option-input" 
                                        placeholder="Option 1"
                                        required
                                        maxlength="200"
                                    >
                                </div>
                                <div class="option-input-group">
                                    <input 
                                        type="text" 
                                        class="form-input option-input" 
                                        placeholder="Option 2"
                                        required
                                        maxlength="200"
                                    >
                                </div>
                            </div>
                            <button type="button" class="btn-add-option" onclick="addOption()">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <line x1="12" y1="5" x2="12" y2="19"></line>
                                    <line x1="5" y1="12" x2="19" y2="12"></line>
                                </svg>
                                Add Option
                            </button>
                            <small class="form-hint">Add 2-10 options for your poll</small>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary btn-large">
                                Create Poll
                            </button>
                        </div>
                    </form>

                    <!-- Success Message -->
                    <div id="success-message" class="alert alert-success" style="display: none;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                        Poll created successfully! Redirecting...
                    </div>

                    <!-- Error Message -->
                    <div id="error-message" class="alert alert-error" style="display: none;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="15" y1="9" x2="9" y2="15"></line>
                            <line x1="9" y1="9" x2="15" y2="15"></line>
                        </svg>
                        <span id="error-text">Something went wrong. Please try again.</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/create-poll.js"></script>
</body>
</html>
